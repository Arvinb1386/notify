name: Build Android Companion APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    # Caches ~/.gradle/caches between runs so dependencies are not re-downloaded
    # from Maven Central every build (cold downloads were being rate-limited, HTTP 429)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Build Debug APK with Gradle
      working-directory: android-companion
      run: |
        for attempt in 1 2 3; do
          echo "::group::Gradle build attempt $attempt"
          if gradle assembleDebug --no-daemon --stacktrace; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          echo "Build attempt $attempt failed (possibly transient mirror/rate-limit issues). Retrying in 30s..."
          sleep 30
        done
        echo "All build attempts failed."
        exit 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: notify-companion-apk
        path: android-companion/app/build/outputs/apk/debug/app-debug.apk
